name: Release

# Publica uma versão: crie a tag vX.Y.Z (ou vX.Y.Z-alpha.N) igual à versão do package.json.
#   .\scripts\publicar-versao.ps1  (os arquivos ficam em .github/workflows no repositório)
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # também dá para rodar pelo botão "Run workflow" na aba Actions (a tag é criada na release)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A tag precisa ser igual à versão do package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME difere da versão $version do package.json" >&2
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Testes (ate 3 tentativas, pois algumas lutas usam sorteio)
        shell: bash
        run: |
          set +e +o pipefail
          for attempt in 1 2 3; do
            npm test 2>&1 | tee test.log
            code=${PIPESTATUS[0]}
            [ "$code" = "0" ] && exit 0
            { grep -E -A8 "not ok" test.log | head -50; tail -25 test.log; } | while IFS= read -r line; do echo "::warning::tentativa $attempt: ${line:0:220}"; done
          done
          exit 1
      - name: Baixar as sprites (para o pacote completo)
        run: npm run sprites -- --dir=sprites-cache
      - run: npm run release:build -- --sprites-dir=sprites-cache
      - name: Teste do executável (sobe o servidor, confere a API e encerra)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = "dist/release/v$version/stage/PokemonSimulator.exe"
          $process = Start-Process -FilePath $exe -ArgumentList '--check' -Wait -PassThru
          Get-Content "dist/release/v$version/stage/logs/latest.log" -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "PokemonSimulator.exe --check terminou com código $($process.ExitCode)" }
      - name: Interface carrega (o index.html e os arquivos que ele cita respondem 200)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = (Resolve-Path "dist/release/v$version/stage").Path
          $env:PORT = '34655'
          $env:POKESIM_HOME = Join-Path $env:RUNNER_TEMP 'pokesim-home'
          $env:WEB_DIST = Join-Path $stage 'app/web'
          $env:ASSETS_DIR = Join-Path $env:RUNNER_TEMP 'sprites-vazio'
          $server = Start-Process -FilePath (Join-Path $stage 'runtime/node.exe') -ArgumentList (Join-Path $stage 'app/server.mjs') -PassThru -WindowStyle Hidden
          try {
            $html = $null
            foreach ($i in 1..30) { try { $html = (Invoke-WebRequest 'http://127.0.0.1:34655/' -UseBasicParsing).Content; break } catch { Start-Sleep -Seconds 1 } }
            if (-not $html) { throw 'O servidor não respondeu.' }
            $refs = [regex]::Matches($html, '(?:src|href)="(/[^"]+\.(?:js|css))"') | ForEach-Object { $_.Groups[1].Value }
            if ($refs.Count -lt 2) { throw "index.html sem js/css: $html" }
            foreach ($ref in $refs) {
              $response = Invoke-WebRequest "http://127.0.0.1:34655$ref" -UseBasicParsing
              if ($response.StatusCode -ne 200) { throw "$ref respondeu $($response.StatusCode)" }
              Write-Host "OK $ref"
            }
          } finally { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = Get-ChildItem "dist/release/v$version" -File | ForEach-Object { $_.FullName }
          $tag = "v$version"
          $arguments = @('release', 'create', $tag) + $files + @('--target', $env:GITHUB_SHA, '--title', "Pokémon Simulator (remake) $tag", '--notes-file', 'RELEASE_NOTES.md')
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
